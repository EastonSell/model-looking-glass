name: Tests

# Runs every test on each pull request and push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install -e ".[app,test]"
      - name: Python tests
        run: python -m pytest tests -q
      - name: Frontend contracts
        run: |
          node tests/app_ui_contract.cjs > /dev/null
          node tests/app_scene_contract.cjs
          node tests/app_lens_contract.cjs
          node tests/app_field_contract.cjs

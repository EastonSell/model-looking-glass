[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-looking-glass"
version = "0.1.0"
description = "Reproducible neural-network observation and causal experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
transformer = ["transformers==4.57.3"]
test = ["numpy>=1.26", "pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["looking_glass*"]

[tool.setuptools.package-data]
looking_glass = ["PROTOCOL.md"]

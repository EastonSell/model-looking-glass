[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-looking-glass"
version = "0.1.0"
description = "A reproducible comparison of direct activation capture and isolated gradient readout"
requires-python = ">=3.10"
dependencies = ["torch>=2.6"]

[tool.setuptools.packages.find]
include = ["looking_glass*"]

[tool.setuptools.package-data]
looking_glass = ["PROTOCOL.md"]

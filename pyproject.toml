[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "model-looking-glass"
version = "1.2.0"
description = "Reproducible neural-network observation and causal experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.15.0", "setuptools>=84.2.1"]

[project.scripts]
model-looking-glass = "looking_glass.app:main"
model-looking-glass-gpu-check = "looking_glass.app_selftest:main"

[project.optional-dependencies]
app = ["torch==2.15.0", "transformers==5.22.1", "safetensors>=0.4.3", "numpy>=1.26", "Pillow==13.0.0"]
transformer = ["transformers==5.22.1"]
test = ["numpy>=1.26", "pytest>=9.0.3,<10", "Pillow==13.0.0"]

[tool.setuptools.packages.find]
include = ["looking_glass*"]

[tool.setuptools.package-data]
looking_glass = ["PROTOCOL.md", "app_static/*.html", "app_static/*.js", "app_static/*.css", "app_static/vendor/*.js", "app_static/vendor/*.woff2", "app_static/vendor/*-LICENSE.txt", "app_static/vendor/provenance.json", "app_static/vendor/README.md"]
